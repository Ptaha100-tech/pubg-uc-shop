services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: shop
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD в .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shop -d shop"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://shop:${POSTGRES_PASSWORD}@db:5432/shop
    depends_on:
      db:
        condition: service_healthy
    # Только внутренний адрес сервера: наружу приложение выставляет nginx (HTTPS, домен).
    # Так порты 80/443 остаются у вашего nginx и другие сайты на сервере не страдают.
    ports:
      - "127.0.0.1:8000:8000"

volumes:
  pgdata:
